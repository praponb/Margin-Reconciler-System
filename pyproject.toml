[project]
name = "reconciler-app"
version = "0.1.0"
description = "Multi-channel fee & margin reconciler for Shopee, Lazada and TikTok Shop"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.20",
    "fastexcel>=0.12",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.18",
    "pydantic-settings>=2.6",
    "streamlit>=1.40",
    "httpx>=0.28",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "xlsxwriter>=3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reconciler_app"]

[tool.pytest.ini_options]
testpaths = ["reconciler_app/tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["reconciler_app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form"]
