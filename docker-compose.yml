# Local PostgreSQL for the reconciler.
#   docker compose up -d
#   export DATABASE_URL=postgresql+psycopg://reconciler:reconciler@localhost:5432/reconciler
#   uv run alembic upgrade head
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: reconciler
      POSTGRES_PASSWORD: reconciler
      POSTGRES_DB: reconciler
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reconciler"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
